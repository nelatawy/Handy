<!doctype html>
<!-- lang/dir are the pre-boot defaults only; LanguageService overwrites
     both on init from the user's stored preference. -->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Handy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts. Loaded here rather than via @import in styles.scss: a CSS
       @import cannot start downloading until the stylesheet itself has
       been fetched and parsed, which serialises two round trips before
       any text can render. Geist carries Latin UI, Cairo carries Arabic,
       Geist Mono carries tabular numerals. Only the weights the type
       scale actually uses are requested. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
